name: Playwright smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: PR smoke E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            script: e2e:pr:desktop
            browser: chromium
          - project: mobile-chrome
            script: e2e:pr:mobile
            browser: chromium
          - project: mobile-webkit
            script: e2e:touch:webkit
            browser: webkit

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify locked toolchain
        run: npm run env:locked

      - name: Install Playwright browsers
        run: npm run e2e:install -- --with-deps ${{ matrix.browser }}

      - name: Run PR smoke E2E
        run: npm run ${{ matrix.script }}

      - name: Write PR smoke summary
        if: always()
        run: |
          {
            echo "## Playwright PR smoke"
            echo ""
            echo "- Command: \`npm run ${{ matrix.script }}\`"
            echo "- Project: \`${{ matrix.project }}\`"
            echo "- Layer: fast mocked critical path"
            echo "- Artifacts: HTML report and retained failed-attempt traces/results are uploaded on completion"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-test-results-${{ matrix.project }}
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
