name: Playwright smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke_shards:
    name: PR smoke shard (${{ matrix.project }}, ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    container:
      # Match the Playwright version in package-lock.json.
      image: mcr.microsoft.com/playwright:v1.61.0-noble@sha256:57b65fdc9ceabe0ef613124c7bbe2babcf9362c4d85e382fe3b03604e84b428a
      options: --ipc=host
    # Partition the complete browser coverage across three independent file shards.
    # Retain two workers per job, the same retries, artifacts and 40-minute bound.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chrome, mobile-webkit]
        shard: [1, 2, 3]
        include:
          - project: chromium
            script: e2e:pr:desktop
          - project: mobile-chrome
            script: e2e:pr:mobile
          - project: mobile-webkit
            script: e2e:touch:webkit

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify locked toolchain
        run: npm run env:locked

      - name: Run PR smoke E2E
        run: npm run ${{ matrix.script }} -- --shard=${{ matrix.shard }}/3

      - name: Write PR smoke summary
        if: always()
        run: |
          {
            echo "## Playwright PR smoke"
            echo ""
            echo "- Command: \`npm run ${{ matrix.script }} -- --shard=${{ matrix.shard }}/3\`"
            echo "- Project: \`${{ matrix.project }}\`"
            echo "- Shard: ${{ matrix.shard }}/3"
            echo "- Layer: complete mocked critical-path coverage"
            echo "- Artifacts: HTML report and retained failed-attempt traces/results are uploaded on completion"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report-${{ matrix.project }}-shard${{ matrix.shard }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-test-results-${{ matrix.project }}-shard${{ matrix.shard }}
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  smoke:
    name: PR smoke E2E (${{ matrix.project }})
    needs: smoke_shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chrome, mobile-webkit]
    steps:
      - name: Require every browser shard to pass
        env:
          SHARDS_RESULT: ${{ needs.smoke_shards.result }}
        run: test "$SHARDS_RESULT" = success
