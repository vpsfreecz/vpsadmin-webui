<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />

    <!--
      Minimal bootstrap (no flash of wrong theme/language)

      We only support English (default) and Czech (browser Czech → Czech).
      UI preferences are stored in localStorage as `vpsadmin.uiSettings.v1`.
    -->
    <script>
      (() => {
        const html = document.documentElement;
        let settings;
        try {
          settings = JSON.parse(window.localStorage.getItem('vpsadmin.uiSettings.v1') || '{}');
        } catch {
          // Optional browser preferences must not prevent the cookie handoff.
        }
        let initiatingTheme;
        try {
          if (location.pathname.endsWith('/oauth/callback')) {
            const pending = JSON.parse(window.sessionStorage.getItem('vpsadmin_ui_next.oauth2.login_state') || '{}');
            if (pending.theme === 'system' || pending.theme === 'light' || pending.theme === 'dark') initiatingTheme = pending.theme;
          } else if (location.pathname.endsWith('/oauth/login')) {
            const themes = new URLSearchParams(location.search).getAll('theme');
            if (themes.length === 1 && ['light', 'dark', 'auto'].includes(themes[0])) initiatingTheme = themes[0];
          }
        } catch {
          // Authentication still requires the ordinary validated login state.
        }
        let returnedTheme;
        try {
          const values = document.cookie.split(';').map((part) => part.trim())
            .filter((part) => part.startsWith('vpsadmin_oauth_theme='));
          const parts = values.length === 1 ? values[0].slice('vpsadmin_oauth_theme='.length).split('.') : [];
          const valid = (value) => value === 'light' || value === 'dark' || value === 'auto';
          if (parts.length === 2 && parts.every(valid)) returnedTheme = parts[0];
        } catch {
          // The settings provider consumes the handoff after bootstrap.
        }
        const theme = returnedTheme || initiatingTheme || settings?.theme;
        if (theme === 'light' || theme === 'dark') {
          html.setAttribute('data-theme', theme);
          html.style.colorScheme = theme;
        } else {
          html.removeAttribute('data-theme');
          html.style.colorScheme = 'light dark';
        }
        const languages = navigator.languages || [navigator.language];
        const detected = languages.some((language) => String(language).toLowerCase().startsWith('cs')) ? 'cs' : 'en';
        html.lang = settings?.language === 'cs' || settings?.language === 'en' ? settings.language : detected;
      })();
    </script>
    <title>vpsAdmin</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      The build-selected BFF mode requires /config.json and /session.json before
      React mounts. Explicit legacy/dev mode keeps optional /config.js and local
      /config.local.js support for older standalone deployments.
    -->
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
